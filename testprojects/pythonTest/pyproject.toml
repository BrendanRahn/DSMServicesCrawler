[project]
name = "firecrawl"
version = "4.43.0"
description = "test python project for using firecrawl sdk"
authors = [
    {name = "Brendan Rahn",email = "brendanrahn01@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "firecrawl-py (>=4.43.0,<5.0.0)",
    "dotenv (>=0.9.9,<0.10.0)",
    "pydantic (>=2.13.5,<3.0.0)"
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
